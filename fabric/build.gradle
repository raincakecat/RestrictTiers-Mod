plugins { id 'net.fabricmc.fabric-loom-remap' version '1.17.21' }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings 'net.fabricmc:yarn:1.21.11+build.6:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11'
    implementation project(':common')
    include project(':common')
    implementation 'com.google.code.gson:gson:2.13.2'
}
base { archivesName = 'RestrictTiers-Fabric-1.21.11' }
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'restricttiers-gametest'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}
if (project.hasProperty('paperVerification')) {
    loom.runs.clientGameTest {
        vmArg '-Drestricttiers.verify.paper=true'
        vmArg '-Dfabric.client.gametest.disableNetworkSynchronizer=true'
    }
}
